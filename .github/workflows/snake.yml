name: generate snake

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST 자동 갱신
  workflow_dispatch:        # Actions 탭에서 수동 실행
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#58a6ff
            dist/snake-light.svg?palette=github-light&color_snake=#1f6feb

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
