<svg xmlns="http://www.w3.org/2000/svg" width="880" height="16" viewBox="0 0 880 16">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff2d95" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#ff2d95" stop-opacity="0.9"/>
      <stop offset="75%"  stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-400%" width="140%" height="900%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="0" y="6.5" width="880" height="3" fill="url(#fade)" filter="url(#g)"/>
  <rect x="0" y="7"   width="880" height="2" fill="url(#fade)"/>
  <rect x="-160" y="6" width="160" height="4" fill="url(#pulse)">
    <animate attributeName="x" from="-160" to="880" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
